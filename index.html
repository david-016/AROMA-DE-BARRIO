<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aroma de Barrio</title>
<meta name="description" content="Pide tu café favorito de Aroma de Barrio desde el móvil.">
<meta name="theme-color" content="#0b1512">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg: #0b1512;
    --surface: #11201a;
    --surface-2: #16271f;
    --line: rgba(255,255,255,0.09);
    --cream: #f2ead9;
    --text: #e7e6df;
    --muted: #93a49c;
    --cyan: #5fe3d3;
    --cyan-dim: rgba(95,227,211,0.14);
    --gold: #d8a857;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #142520 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom: 96px;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:28px 20px 20px;
  }
  header{
    text-align:center;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
  }
  h1{
    font-family: "Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    font-style:italic;
    font-weight:400;
    font-size:2.3rem;
    color:var(--cream);
    margin:0 0 6px;
    letter-spacing:0.3px;
  }
  .subtitle{
    font-size:0.72rem;
    letter-spacing:2.5px;
    color:var(--muted);
    text-transform:uppercase;
  }

  /* Loyalty card */
  .loyalty{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:22px;
  }
  .loyalty-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
  }
  .loyalty-title{
    font-size:0.95rem;
    color:var(--text);
  }
  .loyalty-count{
    font-size:0.8rem;
    color:var(--gold);
  }
  .stamps{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:8px;
  }
  .stamp{
    aspect-ratio:1;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.85rem;
    border:1.5px solid var(--line);
    background:transparent;
    color:transparent;
  }
  .stamp.filled{
    border-color:var(--gold);
    background:radial-gradient(circle at 35% 30%, #f0cf8f, var(--gold) 70%);
    color:#3a2a08;
  }
  .loyalty-note{
    margin-top:12px;
    font-size:0.78rem;
    color:var(--muted);
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.95rem;
    padding:10px 4px 12px;
    cursor:pointer;
    position:relative;
    font-family:inherit;
  }
  .tab.active{
    color:var(--cyan);
  }
  .tab.active::after{
    content:"";
    position:absolute;
    left:10%;
    right:10%;
    bottom:-1px;
    height:2px;
    background:var(--cyan);
    border-radius:2px;
  }

  /* Menu */
  .category{ display:none; }
  .category.active{ display:block; }
  .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{ border-bottom:none; }
  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size:1rem; color:var(--text); }
  .item-price{ font-size:0.85rem; color:var(--muted); margin-top:2px; }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 6px;
  }
  .stepper button{
    width:28px;
    height:28px;
    border-radius:50%;
    border:none;
    background:var(--surface-2);
    color:var(--cyan);
    font-size:1.1rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stepper button:active{ background:var(--cyan-dim); }
  .stepper .qty{
    min-width:16px;
    text-align:center;
    font-size:0.95rem;
    color:var(--text);
  }

  /* Footer / total bar */
  .order-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:linear-gradient(180deg, transparent, var(--bg) 20%);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .order-inner{
    max-width:520px;
    margin:0 auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  .total-block{ line-height:1.2; }
  .total-label{ font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .total-amount{ font-size:1.25rem; color:var(--cream); font-weight:600; }
  .btn-order{
    background:var(--cyan);
    color:#062622;
    border:none;
    border-radius:999px;
    padding:12px 22px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    opacity:0.4;
    pointer-events:none;
    transition:opacity 0.15s ease;
  }
  .btn-order.enabled{
    opacity:1;
    pointer-events:auto;
  }

  footer.info{
    text-align:center;
    margin-top:26px;
    font-size:0.75rem;
    color:var(--muted);
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Aroma de Barrio</h1>
    <div class="subtitle">Cafetería · Desde 2015</div>
  </header>

  <section class="loyalty" aria-label="Tarjeta de fidelidad">
    <div class="loyalty-top">
      <span class="loyalty-title">Tu tarjeta de fidelidad</span>
      <span class="loyalty-count">5 de 8 sellos</span>
    </div>
    <div class="stamps" id="stamps"></div>
    <div class="loyalty-note">8 cafés sellados = el 9º gratis</div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-cat="bebidas" role="tab">Bebidas</button>
    <button class="tab" data-cat="picar" role="tab">Para picar</button>
  </nav>

  <div id="menu"></div>

  <footer class="info">
    C/ Mayor 14 · Lun–Sáb 8:00–20:00<br>
    Pedidos por WhatsApp: 674 467 754
  </footer>
</div>

<div class="order-bar">
  <div class="order-inner">
    <div class="total-block">
      <div class="total-label">Total</div>
      <div class="total-amount" id="totalAmount">0,00 €</div>
    </div>
    <button class="btn-order" id="btnOrder">Pedir</button>
  </div>
</div>

<script>
  const WHATSAPP_NUMBER = "34674467754"; // 674467754 con prefijo de España

  const menu = {
    bebidas: {
      label: "Bebidas",
      items: [
        { id: "cafe_leche", name: "Café con leche", price: 1.80 },
        { id: "cappuccino", name: "Cappuccino", price: 2.20 },
        { id: "cafe_solo", name: "Café solo", price: 1.50 },
        { id: "zumo_naranja", name: "Zumo de naranja natural", price: 2.50 },
        { id: "te_infusion", name: "Té / Infusión", price: 1.80 }
      ]
    },
    picar: {
      label: "Para picar",
      items: [
        { id: "tostada", name: "Tostada con tomate y aceite", price: 2.50 },
        { id: "croissant", name: "Croissant", price: 1.50 },
        { id: "bocadillo_jamon", name: "Bocadillo de jamón", price: 3.50 },
        { id: "napolitana", name: "Napolitana de chocolate", price: 1.70 }
      ]
    }
  };

  const quantities = {};

  function fmt(n){
    return n.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }

  function renderStamps(){
    const container = document.getElementById("stamps");
    const filled = 5, total = 8;
    let html = "";
    for(let i = 1; i <= total; i++){
      html += `<div class="stamp${i <= filled ? " filled" : ""}">${i <= filled ? "☕" : ""}</div>`;
    }
    container.innerHTML = html;
  }

  function renderMenu(){
    const menuEl = document.getElementById("menu");
    let html = "";
    Object.entries(menu).forEach(([catKey, cat]) => {
      html += `<div class="category${catKey === "bebidas" ? " active" : ""}" id="cat-${catKey}">`;
      cat.items.forEach(item => {
        quantities[item.id] = 0;
        html += `
          <div class="item">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">${fmt(item.price)}</div>
            </div>
            <div class="stepper">
              <button type="button" data-action="minus" data-id="${item.id}" aria-label="Quitar uno de ${item.name}">−</button>
              <span class="qty" id="qty-${item.id}">0</span>
              <button type="button" data-action="plus" data-id="${item.id}" aria-label="Añadir uno de ${item.name}">+</button>
            </div>
          </div>`;
      });
      html += `</div>`;
    });
    menuEl.innerHTML = html;
  }

  function allItems(){
    return Object.values(menu).flatMap(cat => cat.items);
  }

  function updateTotal(){
    const total = allItems().reduce((sum, item) => sum + item.price * quantities[item.id], 0);
    document.getElementById("totalAmount").textContent = fmt(total);
    const btn = document.getElementById("btnOrder");
    btn.classList.toggle("enabled", total > 0);
    return total;
  }

  function changeQty(id, delta){
    const next = Math.max(0, (quantities[id] || 0) + delta);
    quantities[id] = next;
    document.getElementById(`qty-${id}`).textContent = next;
    updateTotal();
  }

  function buildOrderText(){
    const lines = [`Pedido — Aroma de Barrio:`];
    allItems().forEach(item => {
      const qty = quantities[item.id];
      if(qty > 0){
        lines.push(`• ${qty}x ${item.name} (${fmt(item.price * qty)})`);
      }
    });
    lines.push(``, `Total: ${fmt(updateTotal())}`);
    return lines.join("\n");
  }

  document.getElementById("menu").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if(!btn) return;
    const delta = btn.dataset.action === "plus" ? 1 : -1;
    changeQty(btn.dataset.id, delta);
  });

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".category").forEach(c => c.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(`cat-${tab.dataset.cat}`).classList.add("active");
    });
  });

  document.getElementById("btnOrder").addEventListener("click", () => {
    if(updateTotal() <= 0) return;
    const text = encodeURIComponent(buildOrderText());
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, "_blank");
  });

  renderStamps();
  renderMenu();
  updateTotal();

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
